name: Replace Hidden 3D Models

on:
  schedule:
    # Runs weekly on Sunday at 03:00 UTC (validation of 200+ models takes ~1 min)
    - cron: '0 3 * * 0'
  workflow_dispatch: {}   # allow manual trigger from Actions tab

jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate + replace hidden 3D models (Supabase)
        env:
          NEXT_PUBLIC_SUPABASE_URL:  ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SKETCHFAB_TOKEN:           ${{ secrets.SKETCHFAB_TOKEN }}
        run: node scripts/replace-hidden-3d-models.mjs
        # Exit code 1 = nothing replaced (no hidden models or none found) — not a failure
        continue-on-error: true

      - name: Sync all data from Supabase to D1
        env:
          NEXT_PUBLIC_SUPABASE_URL:  ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_API_TOKEN:      ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID:     ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID:            ${{ secrets.D1_DATABASE_ID }}
        run: node scripts/migrate-supabase-to-d1.mjs
        continue-on-error: true
