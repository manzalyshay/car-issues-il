name: Replace Hidden 3D Models

on:
  schedule:
    # Runs weekly on Sunday at 03:00 UTC (validation of 200+ models takes ~1 min)
    - cron: '0 3 * * 0'
  workflow_dispatch: {}   # allow manual trigger from Actions tab

jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate + replace hidden 3D models (Supabase)
        env:
          NEXT_PUBLIC_SUPABASE_URL:  ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SKETCHFAB_TOKEN:           ${{ secrets.SKETCHFAB_TOKEN }}
        run: node scripts/replace-hidden-3d-models.mjs
        # Exit code 1 = nothing replaced (no hidden models or none found) — not a failure
        continue-on-error: true

      # The Supabase -> D1 sync step was removed on 2026-11-05: D1 is the source of truth (AGENTS.md),
      # and INSERT OR REPLACE from Supabase would undo changes made directly in D1 (3D models,
      # hidden photos, vehicle counts). Its writes had been failing anyway ("POST not supported").
