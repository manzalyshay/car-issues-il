name: Fetch YouTube Car Review Videos

# Weekly: find review videos for models that have none and write them to production D1
# (scripts/fetch-youtube-d1.mjs, via wrangler). Switched from the Supabase script on 2026-11-05:
# D1 is the source of truth and the site never read the Supabase copy.
on:
  schedule:
    - cron: '41 5 * * 1'   # Mondays 05:41 UTC
  workflow_dispatch:

jobs:
  fetch-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch YouTube videos for models missing them
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/fetch-youtube-d1.mjs --delay 3000
