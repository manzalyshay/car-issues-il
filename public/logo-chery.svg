<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100">
  <rect width="200" height="100" rx="10" fill="white"/>
  <!-- Chery: stylized oval with wing-like swoosh -->
  <ellipse cx="100" cy="50" rx="70" ry="38" fill="none" stroke="#c8102e" stroke-width="4"/>
  <!-- Inner wing swoosh left -->
  <path d="M45 50 Q70 28 100 50 Q70 42 45 50Z" fill="#c8102e"/>
  <!-- Inner wing swoosh right -->
  <path d="M155 50 Q130 28 100 50 Q130 42 155 50Z" fill="#c8102e"/>
  <text x="100" y="75" font-family="Arial,sans-serif" font-weight="700" font-size="13" fill="#c8102e" text-anchor="middle" letter-spacing="3">CHERY</text>
</svg>
