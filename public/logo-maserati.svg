<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100">
  <rect width="200" height="100" rx="10" fill="white"/>
  <!-- Maserati: trident symbol -->
  <!-- Center prong -->
  <line x1="100" y1="12" x2="100" y2="72" stroke="#003087" stroke-width="7" stroke-linecap="round"/>
  <!-- Left prong -->
  <path d="M100 30 Q80 26 72 12" fill="none" stroke="#003087" stroke-width="7" stroke-linecap="round"/>
  <!-- Right prong -->
  <path d="M100 30 Q120 26 128 12" fill="none" stroke="#003087" stroke-width="7" stroke-linecap="round"/>
  <!-- Handle bar -->
  <line x1="78" y1="72" x2="122" y2="72" stroke="#003087" stroke-width="6" stroke-linecap="round"/>
  <text x="100" y="92" font-family="Arial,sans-serif" font-weight="700" font-size="11" fill="#003087" text-anchor="middle" letter-spacing="2">MASERATI</text>
</svg>
