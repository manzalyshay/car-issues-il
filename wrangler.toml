name = "car-issues-il"
main = "worker-entry.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Custom routes — carissues.net (EN) and carissues.co.il (HE) serve the same Worker
routes = [
  { pattern = "carissues.co.il/*", zone_name = "carissues.co.il" },
  { pattern = "www.carissues.co.il/*", zone_name = "carissues.co.il" },
  { pattern = "en.carissues.co.il/*", zone_name = "carissues.co.il" },
  { pattern = "carissues.net/*", zone_name = "carissues.net" },
  { pattern = "www.carissues.net/*", zone_name = "carissues.net" },
]

# Cloudflare Cron Triggers — dispatched in worker-entry.js's scheduled() handler
[triggers]
# Recalls run hourly in small batches (a full pass over all models takes a few runs);
# Israeli recall data syncs daily at 02:40 UTC; news at 06:00 UTC, with Gemini retries of
# still-untranslated news at 11:30 and 17:30 UTC. Every run is logged in D1 cron_runs.
crons = ["17 * * * *", "40 2 * * *", "0 6 * * *", "30 11 * * *", "30 17 * * *"]

# Static assets served via ASSETS binding (Next.js static + public/ files)
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Public env vars (non-sensitive — secrets go in Cloudflare dashboard or wrangler secret put)
[vars]
NEXT_PUBLIC_SUPABASE_URL = "https://smzqfyqhiqwisvbsvchx.supabase.co"
NEXT_PUBLIC_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtenFmeXFoaXF3aXN2YnN2Y2h4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxNzM0NDUsImV4cCI6MjA4OTc0OTQ0NX0.LttBMWlaunURkzQBx4k0xZk-oOINO67AUCvNExcRZcY"
# GEMINI_API_KEY and MISTRAL_API_KEY are set as Worker secrets via:
#   wrangler secret put GEMINI_API_KEY
#   wrangler secret put MISTRAL_API_KEY
# UK DVLA vehicle lookup API key (register free at https://developer-portal.driver-vehicle-licensing.api.gov.uk/):
#   wrangler secret put DVLA_API_KEY
# UK DVSA recall data — covers EU/non-US models (Qashqai, MG, Peugeot, Duster, etc.)
# Register free at https://developer-portal.driver-vehicle-licensing.agency.gov.uk/ → subscribe to "Vehicle Recalls and Faults"
#   wrangler secret put DVSA_API_KEY

# D1 database binding — replace REPLACE_WITH_D1_DATABASE_ID with the actual ID from CF dashboard
[[d1_databases]]
binding = "DB"
database_name = "car-issues-db"
database_id = "090762ad-b029-4883-b827-9376cdee1ed2"
remote = true

# OpenNext tag cache (revalidatePath/revalidateTag) — same D1 database, table `revalidations`
[[d1_databases]]
binding = "NEXT_TAG_CACHE_D1"
database_name = "car-issues-db"
database_id = "090762ad-b029-4883-b827-9376cdee1ed2"
remote = true

# OpenNext incremental cache: rendered pages, so `revalidate` actually caches (open-next.config.ts)
[[r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "car-issues-next-cache"

# memoryQueue re-renders stale pages by calling this Worker
[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "car-issues-il"

[ai]
binding = "AI"
